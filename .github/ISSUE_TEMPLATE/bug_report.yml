name: Bug report
description: Something does not work or crashes
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in the versions, the steps and attach the log.
  - type: input
    id: mod
    attributes:
      label: Bomb Run version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Minecraft and loader
      options:
        - 1.21.1 NeoForge
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Where
      options:
        - Singleplayer
        - Server (mod on server and client)
        - Server (players without the mod)
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: At least explosion, optimisation and land-claim mods, and Sodium / Iris, if any.
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Planes, payload, pattern, radius, or the /bombrun strike command you used.
  - type: textarea
    id: log
    attributes:
      label: Log or crash report
      description: Upload logs/latest.log (or the crash report) to https://mclo.gs and paste the link.
